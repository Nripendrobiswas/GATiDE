[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-tide"
version = "0.1.0"
description = "Gated-Attention Time-series Dense Encoder (GA-TiDE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nripendro Biswas" }]
keywords = ["time-series", "forecasting", "tide", "darts", "attention"]

# Pinned: GA-TiDE depends on Darts' private module internals.
dependencies = [
    "darts==0.46.1",
    "torch==2.10.0",
    "pytorch-lightning==2.6.5",
    "numpy==2.0.2",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "optuna>=3.6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
